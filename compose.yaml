name: agent-office-relay
services:
  graph:
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    ports:
      - "127.0.0.1:6387:6379"
    environment:
      BROWSER: "0"
      REDIS_ARGS: "--appendonly yes --appendfsync always --dir /var/lib/falkordb/data"
    volumes:
      - relay-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
volumes:
  relay-data:
